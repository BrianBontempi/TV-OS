name: Compila app

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compila
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepara il file
        run: cp app/build/outputs/apk/debug/app-debug.apk tv-home.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tv-home
          path: tv-home.apk

      - name: Pubblica la versione da scaricare sulla TV
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima tv-home.apk \
            --title "Ultima versione" \
            --notes "Compilata dal commit ${GITHUB_SHA::7}" \
            --latest
